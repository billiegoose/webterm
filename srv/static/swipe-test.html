<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swipe Pad Test</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --accent: #58a6ff;
    --btn-bg: #21262d;
    --btn-active: #30363d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Layout */
  .container {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .terminal-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    overflow: hidden;
  }
  .terminal-area h2 {
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .terminal-placeholder {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 13px;
    color: #8b949e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80px;
  }

  /* Direction indicator */
  .direction-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
  }
  .dir-grid {
    display: grid;
    grid-template-columns: 40px 40px 40px;
    grid-template-rows: 40px 40px 40px;
    gap: 2px;
  }
  .dir-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #484f58;
    border-radius: 4px;
    transition: color 0.1s, background 0.1s;
  }
  .dir-cell.active {
    color: var(--accent);
    background: rgba(88, 166, 255, 0.15);
  }
  .dir-label {
    font-size: 13px;
    color: #8b949e;
  }
  .dir-label .seq {
    font-family: "SF Mono", Monaco, Consolas, monospace;
    color: var(--accent);
    font-size: 12px;
  }

  /* Event log */
  .log-section {
    padding: 0 12px 8px;
  }
  .log-section h3 {
    font-size: 12px;
    color: #8b949e;
    margin-bottom: 4px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .event-log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "SF Mono", Monaco, Consolas, monospace;
    font-size: 12px;
    height: 100px;
    overflow-y: auto;
    line-height: 1.6;
  }
  .event-log .entry {
    color: #8b949e;
  }
  .event-log .entry .dir {
    color: var(--accent);
    font-weight: 600;
  }
  .event-log .entry .esc {
    color: #f0883e;
  }
  .event-log .entry .repeat {
    color: #484f58;
    font-style: italic;
  }

  /* Quick bar */
  .quick-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0 4px;
    padding-bottom: max(0px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 2px;
    height: 40px;
  }
  .qbtn {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s;
  }
  .qbtn:active {
    background: var(--border);
  }

  /* Swipe pad button */
  .swipe-pad {
    position: relative;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    padding: 5px 10px;
    cursor: pointer;
    touch-action: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .swipe-pad.engaged {
    border-color: var(--accent);
    background: #1a2332;
  }

  /* Cross arrows SVG inside the pad */
  .pad-svg {
    display: block;
    pointer-events: none;
  }
  .pad-svg .arrow { fill: #484f58; transition: fill 0.08s; }
  .pad-svg .dot   { fill: #484f58; transition: fill 0.08s; }
  .swipe-pad.engaged .pad-svg .dot { fill: var(--accent); }
  .swipe-pad.dir-up    .pad-svg .arrow-up    { fill: var(--accent); }
  .swipe-pad.dir-down  .pad-svg .arrow-down  { fill: var(--accent); }
  .swipe-pad.dir-left  .pad-svg .arrow-left  { fill: var(--accent); }
  .swipe-pad.dir-right .pad-svg .arrow-right { fill: var(--accent); }

  /* Ripple effect on fire */
  .swipe-pad .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(88, 166, 255, 0.25);
    pointer-events: none;
    animation: ripple-out 0.35s ease-out forwards;
  }
  @keyframes ripple-out {
    0%   { transform: scale(0.3); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }
  }

  .spacer { flex: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="terminal-area">
    <h2>Swipe-Pad Prototype</h2>
    <div class="terminal-placeholder">
      <div class="direction-display">
        <div class="dir-grid">
          <div class="dir-cell"></div>
          <div class="dir-cell" id="ind-up">▲</div>
          <div class="dir-cell"></div>
          <div class="dir-cell" id="ind-left">◀</div>
          <div class="dir-cell" style="font-size:10px;color:#484f58">●</div>
          <div class="dir-cell" id="ind-right">▶</div>
          <div class="dir-cell"></div>
          <div class="dir-cell" id="ind-down">▼</div>
          <div class="dir-cell"></div>
        </div>
        <div class="dir-label">
          <div>Last: <span id="last-dir">—</span></div>
          <div class="seq" id="last-seq">&nbsp;</div>
          <div style="margin-top:4px">Count: <span id="fire-count">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="log-section">
    <h3>Event Log</h3>
    <div class="event-log" id="event-log"></div>
  </div>

  <div class="quick-bar">
    <button class="qbtn wide">Tab</button>
    <button class="qbtn wide">Esc</button>
    <button class="qbtn wide">Ctrl</button>
    <div class="swipe-pad" id="swipe-pad">
      <svg class="pad-svg" width="16" height="16" viewBox="0 0 16 16">
        <polygon class="arrow arrow-up"    points="8,1 10.5,5 5.5,5"/>
        <polygon class="arrow arrow-down"  points="8,15 10.5,11 5.5,11"/>
        <polygon class="arrow arrow-left"  points="1,8 5,5.5 5,10.5"/>
        <polygon class="arrow arrow-right" points="15,8 11,5.5 11,10.5"/>
        <circle  class="dot" cx="8" cy="8" r="1.2"/>
      </svg>
    </div>
    <button class="qbtn">|</button>
    <button class="qbtn">~</button>
    <button class="qbtn">/</button>
    <div class="spacer"></div>
  </div>
</div>

<script>
(function() {
  const pad       = document.getElementById('swipe-pad');
  const logEl     = document.getElementById('event-log');
  const lastDirEl = document.getElementById('last-dir');
  const lastSeqEl = document.getElementById('last-seq');
  const countEl   = document.getElementById('fire-count');

  const DIRS = {
    up:    { seq: '\x1b[A', label: '↑ Up',    display: 'ESC[A' },
    down:  { seq: '\x1b[B', label: '↓ Down',  display: 'ESC[B' },
    right: { seq: '\x1b[C', label: '→ Right', display: 'ESC[C' },
    left:  { seq: '\x1b[D', label: '← Left',  display: 'ESC[D' },
  };

  const THRESHOLD        = 12;   // px to determine direction
  const REPEAT_DELAY     = 400;  // ms before repeat starts
  const REPEAT_INTERVAL  = 80;   // ms between repeats

  let tracking   = false;
  let startX     = 0;
  let startY     = 0;
  let currentDir = null;
  let repeatTimer = null;
  let fireCounter = 0;

  // --- Indicator elements ---
  const indicators = {
    up:    document.getElementById('ind-up'),
    down:  document.getElementById('ind-down'),
    left:  document.getElementById('ind-left'),
    right: document.getElementById('ind-right'),
  };
  function clearHighlights() {
    for (const d in indicators) {
      indicators[d].classList.remove('active');
    }
    pad.classList.remove('dir-up', 'dir-down', 'dir-left', 'dir-right');
  }

  function highlightDir(dir) {
    clearHighlights();
    if (dir) {
      indicators[dir].classList.add('active');
      pad.classList.add('dir-' + dir);
    }
  }

  function spawnRipple(dir) {
    const r = document.createElement('div');
    r.className = 'ripple';
    const sz = 20;
    // Position ripple toward the fired direction
    const cx = pad.offsetWidth / 2;
    const cy = pad.offsetHeight / 2;
    const offsets = { up: [0, -8], down: [0, 8], left: [-10, 0], right: [10, 0] };
    const [ox, oy] = offsets[dir] || [0, 0];
    r.style.width = sz + 'px';
    r.style.height = sz + 'px';
    r.style.left = (cx + ox - sz/2) + 'px';
    r.style.top  = (cy + oy - sz/2) + 'px';
    pad.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  }

  function fireDirection(dir, isRepeat) {
    if (!dir) return;
    const info = DIRS[dir];
    fireCounter++;
    countEl.textContent = fireCounter;
    lastDirEl.textContent = info.label;
    lastSeqEl.textContent = info.display;

    // Log entry
    const entry = document.createElement('div');
    entry.className = 'entry';
    const ts = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 });
    entry.innerHTML = `<span style="color:#484f58">${ts}</span> `
      + `<span class="dir">${info.label.padEnd(8)}</span> `
      + `<span class="esc">${info.display}</span>`
      + (isRepeat ? ` <span class="repeat">(repeat)</span>` : '');
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;

    // Visual feedback
    highlightDir(dir);
    if (!isRepeat) spawnRipple(dir);
  }

  function detectDirection(dx, dy) {
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    // Need at least threshold in the dominant axis
    const maxD = Math.max(absDx, absDy);
    if (maxD < THRESHOLD) return null;
    if (absDx > absDy) {
      return dx > 0 ? 'right' : 'left';
    } else {
      return dy > 0 ? 'down' : 'up';
    }
  }

  function stopRepeat() {
    if (repeatTimer) { clearInterval(repeatTimer); repeatTimer = null; }
  }

  function startRepeat(dir) {
    stopRepeat();
    // First fire immediately
    fireDirection(dir, false);
    // Then start repeating after delay
    let started = false;
    repeatTimer = setTimeout(() => {
      repeatTimer = setInterval(() => {
        fireDirection(dir, true);
      }, REPEAT_INTERVAL);
    }, REPEAT_DELAY);
  }

  // Start of gesture
  function onStart(x, y, e) {
    e.preventDefault();
    tracking = true;
    startX = x;
    startY = y;
    currentDir = null;
    pad.classList.add('engaged');
    clearHighlights();
  }

  // Movement during gesture
  function onMove(x, y) {
    if (!tracking) return;
    const dx = x - startX;
    const dy = y - startY;
    const dir = detectDirection(dx, dy);

    if (dir !== currentDir) {
      // Direction changed (or first detection)
      currentDir = dir;
      highlightDir(dir);

      if (dir) {
        // Start repeat cycle for this direction
        stopRepeat();
        fireDirection(dir, false);
        // Set up auto-repeat
        const delayId = setTimeout(() => {
          repeatTimer = setInterval(() => {
            if (currentDir === dir) {
              fireDirection(dir, true);
            }
          }, REPEAT_INTERVAL);
        }, REPEAT_DELAY);
        repeatTimer = delayId;
      } else {
        stopRepeat();
      }
    }
  }

  // End of gesture
  function onEnd() {
    if (!tracking) return;
    tracking = false;
    stopRepeat();
    pad.classList.remove('engaged');
    // Keep the highlight briefly then clear
    setTimeout(() => {
      if (!tracking) clearHighlights();
    }, 200);
  }

  // --- Touch events ---
  pad.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    onStart(t.clientX, t.clientY, e);
  }, { passive: false });

  pad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, { passive: false });

  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    onEnd();
  });
  pad.addEventListener('touchcancel', () => onEnd());

  // --- Mouse events (for desktop testing) ---
  pad.addEventListener('mousedown', (e) => {
    onStart(e.clientX, e.clientY, e);
  });
  document.addEventListener('mousemove', (e) => {
    if (tracking) onMove(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', () => onEnd());

  // Initial log message
  const intro = document.createElement('div');
  intro.className = 'entry';
  intro.innerHTML = '<span style="color:#484f58">Touch the pad and drag in any direction. Auto-repeat fires if held.</span>';
  logEl.appendChild(intro);
})();
</script>
</body>
</html>
